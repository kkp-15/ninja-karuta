<!--
═══════════ 開発メモ ═══════════
手持ちのかるたで遊ぶための「読み手」アプリ。札の文だけ登録すれば、
あとはランダムに読み上げる。読み手がいなくても全員が取り手に回れる。

■ 設計ルール
- 単一HTML / フレームワークなし / Cloudflare Pages
- 読み上げは Web Speech API。日本語音声は端末内蔵なので通信不要
- 保存は localStorage のみ。サーバに送らない（登録した札は端末から出ない）
- 山札モデル：一度読んだ札は戻さない。重複しないのが実際のかるたと同じ
════════════════════════════
-->

<body>
<header>
  <h1>かるた読み上げ</h1>
  <p>手持ちの札を登録すれば、読み手がいなくても遊べます</p>
</header>

<main>
  <!-- 遊ぶ -->
  <section class="card" id="secPlay">
    <div class="play">
      <div class="count" id="count">まず札を登録してください</div>
      <div class="fuda" id="fuda">－</div>
      <div class="bar"><i id="prog" style="width:0"></i></div>
      <button class="btn big" id="btnNext" type="button" disabled>読み上げる</button>
      <div class="row" style="margin-top:8px">
        <button class="btn2" id="btnAgain" type="button" disabled>もう一度</button>
        <button class="btn2" id="btnReset" type="button" disabled>最初から</button>
      </div>
      <p class="note" id="playNote"></p>
    </div>
  </section>

  <!-- 設定 -->
  <section class="card">
    <h2>読み方</h2>
    <div class="row">
      <div>
        <label class="f" for="voice">声</label>
        <select id="voice"></select>
        <button class="btn2" id="btnTry" type="button" style="width:100%;margin-top:6px">この声を聞く</button>
      </div>
      <div>
        <label class="f" for="rate">速さ <span id="rateV">1.0</span></label>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9" style="width:100%">
      </div>
    </div>
    <p class="note" id="voiceNote"></p>
    <label class="f"><input type="checkbox" id="maskFuda"> 読み札の文字を隠す（音だけで取る）</label>
    <label class="f"><input type="checkbox" id="twice" checked> 同じ札を2回読む（かるたの作法）</label>
  </section>

  <!-- 札の登録 -->
  <section class="card">
    <h2>札を登録する</h2>
    <label class="f" for="setName">かるたの名前</label>
    <input type="text" id="setName" placeholder="例: 学校の宿題かるた" autocomplete="off">
    <label class="f" for="bulk">読み上げ文（1行に1枚）</label>
    <textarea id="bulk" placeholder="いぬもあるけばぼうにあたる&#10;ろんよりしょうこ&#10;はなよりだんご"></textarea>
    <p class="note">スマホで撮った写真から文字を取り込むには、iPhoneなら写真アプリの「テキストを読み取る」、Androidならレンズでコピーして、ここに貼り付けてください。まとめて貼っても1行ずつ札になります。</p>
    <div class="row" style="margin-top:10px">
      <button class="btn g" id="btnSave" type="button">この内容で保存</button>
      <button class="btn2" id="btnClearAll" type="button">全部消す</button>
    </div>
  </section>

  <!-- 一覧 -->
  <section class="card">
    <h2>登録した札 <span id="num" style="color:var(--ink-soft);font-size:13px"></span></h2>
    <div class="list" id="list"><div class="empty">まだ札がありません</div></div>

    <div class="ad-slot" id="ad-after-list">
      <div class="ad-label">広告</div>
      <ins class="adsbygoogle" style="display:block"
           data-ad-client="ca-pub-1298304917726270"
           data-ad-slot="2937937957"
           data-ad-format="horizontal"
           data-full-width-responsive="false"></ins>
    </div>
  </section>
</main>

<footer>
  <p>登録した札はこの端末の中だけに保存されます。外部に送信しません。</p>
</footer>
<script>

const $ = (id) => document.getElementById(id);
const KEY = 'ninja-karuta-v1';

let state = { name: '', cards: [], voice: '', rate: 0.9, mask: false, twice: true };
let deck = [];        // まだ読んでいない札の番号（山札）
let current = -1;     // いま読んだ札

/* ===== 保存 ===== */
function load(){
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (j && Array.isArray(j.cards)) state = Object.assign(state, j);
  } catch (e) {}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert('保存できませんでした。端末の空き容量をご確認ください。'); }
}

/* ===== 読み上げ ===== */
let voices = [];
// 端末が持っている日本語の声を並べる。名前は「Eddy (日本語（日本）)」のように
// 長くて分かりにくいので、括弧の中を落として短くする。
function prettyName(n){ return n.replace(/\s*[（(].*$/, '').trim() || n; }
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  const sel = $('voice');
  if (!voices.length) {
    sel.innerHTML = '<option value="">日本語の声が見つかりません</option>';
    sel.disabled = true; $('btnTry').disabled = true;
    $('voiceNote').textContent = 'この端末には日本語の音声が入っていないようです。端末の設定から日本語音声を追加すると読み上げられます。';
    return;
  }
  sel.disabled = false; $('btnTry').disabled = false;
  $('voiceNote').textContent = '';
  sel.innerHTML = voices.map(v =>
    '<option value="' + v.name + '">' + prettyName(v.name) + (v.localService ? '' : '（通信あり）') + '</option>').join('');
  if (state.voice && voices.some(v => v.name === state.voice)) sel.value = state.voice;
  else state.voice = sel.value;
}
function speak(text, onEnd){
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.name === state.voice);
  if (v) u.voice = v;
  u.lang = 'ja-JP';
  u.rate = state.rate;
  u.onend = () => onEnd && onEnd();
  u.onerror = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}
// かるたの作法にならい、同じ札を2回読む
function readCard(text){
  $('fuda').classList.add('speaking');
  const done = () => $('fuda').classList.remove('speaking');
  if (state.twice) speak(text, () => setTimeout(() => speak(text, done), 350));
  else speak(text, done);
}

/* ===== 山札 ===== */
function shuffleDeck(){
  deck = state.cards.map((_, i) => i);
  for (let i = deck.length - 1; i > 0; i--) {          // フィッシャー・イェーツ
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = -1;
}
function next(){
  if (!state.cards.length) return;
  if (!deck.length) {                                   // 読み切った
    current = -1;
    renderPlay('読み切りました。「最初から」で、もう一度遊べます。');
    return;
  }
  current = deck.pop();
  renderPlay();
  readCard(state.cards[current]);
}

/* ===== 画面 ===== */
function renderPlay(msg){
  const total = state.cards.length;
  const left = deck.length;
  const read = total - left - (current >= 0 ? 1 : 0);
  $('count').textContent = total
    ? '全' + total + '枚　残り' + left + '枚'
    : 'まず札を登録してください';
  const f = $('fuda');
  f.textContent = current >= 0 ? state.cards[current] : '－';
  f.classList.toggle('masked', state.mask && current >= 0);
  $('prog').style.width = total ? ((total - left) / total * 100) + '%' : '0';
  $('btnNext').disabled = !total;
  $('btnNext').textContent = current < 0 ? '読み上げる' : (left ? '次の札へ' : 'おしまい');
  $('btnAgain').disabled = current < 0;
  $('btnReset').disabled = !total;
  $('playNote').textContent = msg || '';
}
function renderList(){
  $('num').textContent = state.cards.length ? '（' + state.cards.length + '枚）' : '';
  const el = $('list');
  if (!state.cards.length) { el.innerHTML = '<div class="empty">まだ札がありません</div>'; return; }
  el.innerHTML = state.cards.map((c, i) =>
    '<div class="item"><span class="n">' + (i + 1) + '</span><span class="t"></span>' +
    '<button class="x" type="button" data-i="' + i + '" aria-label="' + (i + 1) + '枚目を消す">×</button></div>'
  ).join('');
  // 札の文はテキストとして入れる（HTMLとして解釈させない）
  el.querySelectorAll('.item .t').forEach((n, i) => { n.textContent = state.cards[i]; });
  el.querySelectorAll('.x').forEach(b => b.onclick = () => {
    state.cards.splice(+b.dataset.i, 1); save(); shuffleDeck(); renderList(); renderPlay(); syncBulk();
  });
}
function syncBulk(){ $('bulk').value = state.cards.join('\n'); $('setName').value = state.name; }

/* ===== 操作 ===== */
$('btnNext').onclick = next;
$('btnAgain').onclick = () => { if (current >= 0) readCard(state.cards[current]); };
$('btnReset').onclick = () => { speechSynthesis.cancel(); shuffleDeck(); renderPlay('山札を混ぜ直しました。'); };
$('btnSave').onclick = () => {
  const lines = $('bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
  state.name = $('setName').value.trim();
  state.cards = lines;
  save(); shuffleDeck(); renderList(); renderPlay(lines.length ? lines.length + '枚を保存しました。' : '');
};
$('btnClearAll').onclick = () => {
  if (!state.cards.length && !$('bulk').value) return;
  if (!confirm('登録した札をすべて消します。よろしいですか。')) return;
  state.cards = []; state.name = ''; save(); shuffleDeck(); renderList(); renderPlay(); syncBulk();
};
$('voice').onchange = (e) => { state.voice = e.target.value; save(); tryVoice(); };
function tryVoice(){
  const sample = state.cards[0] || 'いぬもあるけば ぼうにあたる';
  speechSynthesis.cancel();
  speak(sample);
}
$('btnTry').onclick = tryVoice;
$('rate').oninput = (e) => { state.rate = +e.target.value; $('rateV').textContent = state.rate.toFixed(1); };
$('rate').onchange = save;
$('maskFuda').onchange = (e) => { state.mask = e.target.checked; save(); renderPlay(); };
$('twice').onchange = (e) => { state.twice = e.target.checked; save(); };

/* ===== 起動 ===== */
load();
syncBulk();
$('rate').value = state.rate; $('rateV').textContent = state.rate.toFixed(1);
$('maskFuda').checked = state.mask; $('twice').checked = state.twice;
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;
shuffleDeck(); renderList(); renderPlay();

// 広告は画面に近づいてから読み込む
(function mountAd(){
  const slot = $('ad-after-list'); if (!slot) return;
  let done = false;
  const go = () => { if (done) return; done = true;
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {} };
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { go(); io.disconnect(); } }),
      { rootMargin: '300px 0px' });
    io.observe(slot);
  } else go();
})();

</script>
